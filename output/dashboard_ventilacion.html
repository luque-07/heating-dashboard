<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de ventilación</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f4f6f9;
            color: #222;
        }
        h1 {
            text-align: center;
        }
        .grafica {
            width: 100%;
            height: 350px;
            margin-bottom: 20px;
            background: white;
        }
    </style>
</head>
<body>
    <h1>Dashboard de ventilación</h1>

    <div id="graficaPrincipal" class="grafica"></div>
    <div id="graficaSecundaria" class="grafica"></div>

    <script>
        const datos = {"dias": ["2026-10-12", "2026-10-13", "2026-10-14", "2026-10-15", "2026-10-16", "2026-10-17", "2026-10-18"], "principal": [3.5, 3.7, 4.6, 3.3, 2.3, 10.4, 16.8], "secundario": [32.5, 31.5, 27.0, 33.5, 38.5, 0.0, 0.0]};

        const graficaPrincipal = echarts.init(
            document.getElementById("graficaPrincipal")
        );
        const graficaSecundaria = echarts.init(
            document.getElementById("graficaSecundaria")
        );

        graficaPrincipal.setOption({
            title: { text: "Velocidad media diaria del viento" },
            tooltip: { trigger: "axis" },
            grid: { left: 75, right: 30, bottom: 45 },
            xAxis: {
                type: "category",
                data: datos.dias,
                name: "Día"
            },
            yAxis: {
                type: "value",
                name: "Velocidad (km/h)"
            },
            series: [{
                name: "Velocidad del viento",
                type: "line",
                data: datos.principal,
                smooth: true
            }]
        });

        graficaSecundaria.setOption({
            title: { text: "Uso estimado de ventilación" },
            tooltip: { trigger: "axis" },
            grid: { left: 75, right: 30, bottom: 45 },
            xAxis: {
                type: "category",
                data: datos.dias,
                name: "Día"
            },
            yAxis: {
                type: "value",
                name: "Uso estimado (kWh)"
            },
            series: [{
                name: "Uso de ventilación",
                type: "bar",
                data: datos.secundario
            }]
        });

        window.addEventListener("resize", () => {
            graficaPrincipal.resize();
            graficaSecundaria.resize();
        });
    </script>
</body>
</html>
